<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SIP — 100 Problem Sums (Input Answers)</title>
<style>
  :root{
    --accent:#0b63d5;
    --muted:#666;
    --good:#c9f1d0;
    --bad:#ffd6d6;
    --card:#ffffff;
    --bg:#f3f8ff;
  }
  html,body{height:100%;margin:0;}
  body{
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background:var(--bg);
    color:#111;
    padding:18px;
    box-sizing:border-box;
  }
  header{
    display:flex;
    gap:12px;
    align-items:center;
    margin-bottom:14px;
  }
  header img{height:54px; width:54px; object-fit:contain; border-radius:8px; background:white; padding:6px;}
  h1{font-size:20px;margin:0;color:var(--accent);}
  .controls{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 18px;}
  button{
    background:var(--accent); color:white; border:0; padding:10px 14px;
    border-radius:8px; cursor:pointer; font-weight:600;
  }
  button.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent);}
  #scoreBox{margin-left:8px; font-weight:700; color:#083a8a; align-self:center;}
  main{display:block;}
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  .column{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .card{
    background:var(--card);
    border-radius:10px;
    padding:10px;
    box-shadow:0 1px 4px rgba(20,30,60,0.06);
    break-inside:avoid;
  }
  .qnum{font-weight:700;color:var(--muted); font-size:13px; display:inline-block; width:30px;}
  .qtext{font-size:16px; display:inline-block; vertical-align:middle; margin-left:6px;}
  .ansBox{
    width:110px; padding:6px; font-size:15px; border-radius:6px; border:1px solid #ccc;
  }
  #resultsPanel{margin-top:16px; padding:12px; background:white; border-left:5px solid var(--accent); border-radius:8px; display:none; max-height:50vh; overflow:auto;}
  .solutions{margin-top:12px;}
  .sol{padding:8px;border-radius:6px;margin-bottom:6px;}
  .sol.correct{background:var(--good);}
  .sol.incorrect{background:var(--bad);}
  footer{margin-top:18px; font-size:13px; color:var(--muted);}
  @media(max-width:900px){
    .grid{grid-template-columns:1fr;}
    header img{height:46px;width:46px;}
  }
  /* Print tweaks */
  @media print {
    .controls, footer { display: none; }
    body { padding: 6mm; }
    .grid { gap: 8px; }
    .card { page-break-inside: avoid; }
    #resultsPanel { display:block; }
  }
</style>
</head>
<body>

<header>
  <img src="" alt="logo" id="logoPlaceholder">
  <div>
    <h1>SIP Problem Sums — 100 Questions</h1>
    <div style="font-size:13px;color:var(--muted)">Class-2 / Contest style — mixed + - × ÷</div>
  </div>
  <div style="margin-left:auto;display:flex;align-items:center;">
    <div id="scoreBox">Not yet attempted</div>
  </div>
</header>

<div class="controls">
  <button id="btnCheck">Check Answers</button>
  <button id="btnReset" class="ghost">New Set (Regenerate)</button>
  <button id="btnShowSol" class="ghost">Show Solutions</button>
  <button id="btnDownload" class="ghost">Print / Save as PDF</button>
</div>

<main id="mainArea">
  <div class="grid" id="gridArea">
    <div class="column" id="colLeft"></div>
    <div class="column" id="colRight"></div>
  </div>

  <div id="resultsPanel">
    <div id="summaryText"></div>
    <div class="solutions" id="solutions"></div>
  </div>
</main>

<footer>
  Tip: Use the "New Set" button to regenerate a different combination. This page is static and works offline.
</footer>

<script>
/* 100 SIP problem sums — input answer version
   The question set is fixed (from user's requested 100) but regenerate re-shuffles order.
*/

  {q:"A shop sells 8 ice-creams each hour. How many in 6 hours?", a:48},
  {q:"There are 30 pencils. Teacher gives 5 pencils each to students. How many students get pencils?", a:6},

  {q:"55 bananas in a crate. 20 are sold. How many left?", a:35},

  {q:"40 oranges. Divide among 5 boys. Each gets?", a:8},
  {q:"90 notebooks. 30 used. Remaining?", a:60},
  {q:"7 teams with 5 players each. Total players?", a:35},
  {q:"18 litres juice shared among 6 children. Litres each?", a:3},
  {q:"46 apples. Add 27. Total?", a:73},
  {q:"87 stickers. 33 given away. How many left?", a:54},
  {q:"6 bunches with 9 grapes each. Total grapes?", a:54},
  {q:"54 chocolates shared equally among 6 kids. How many per kid?", a:9}

// current working set (we'll shuffle a copy so "New Set" reorders questions)
let currentSet = [];

// helper shuffle
function shuffle(arr){
  for(let i = arr.length-1; i>0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// build working set (shuffled copy)
function buildSet(){
  const copy = ORIGINAL.map(o => ({ q: o.q, a: o.a }));
  return shuffle(copy);
}

// render two columns
function render(set){
  const left = document.getElementById('colLeft');
  const right = document.getElementById('colRight');
  left.innerHTML = ''; right.innerHTML = '';

  const fragL = document.createDocumentFragment();
  const fragR = document.createDocumentFragment();

  for(let i=0;i<set.length;i++){
    const item = set[i];
    const card = document.createElement('div');
    card.className = 'card';
    const id = i+1;
    card.innerHTML = `
      <div>
        <span class="qnum">${id}.</span>
        <span class="qtext">${item.q}</span>
      </div>
      <div style="margin-top:8px;">
        <input type="number" inputmode="numeric" class="ansBox" id="ans-${id}" aria-label="Answer for question ${id}">
      </div>
    `;
    if(i % 2 === 0) fragL.appendChild(card); else fragR.appendChild(card);
  }
  left.appendChild(fragL);
  right.appendChild(fragR);
}

// check answers and show results
function checkAnswers(){
  let score = 0;
  const solDiv = document.getElementById('solutions');
  solDiv.innerHTML = '';
  for(let i=0;i<currentSet.length;i++){
    const id = i+1;
    const correct = currentSet[i].a;
    const inp = document.getElementById(`ans-${id}`);
    const raw = inp ? inp.value.trim() : '';
    const parsed = raw === '' ? null : Number(raw);
    const sol = document.createElement('div');
    sol.className = 'sol';
    if(parsed !== null && !Number.isNaN(parsed) && Number(parsed) === Number(correct)){
      score++;
      sol.classList.add('correct');
      sol.innerHTML = `<strong>Q${id}</strong> — Your answer: <strong>${parsed}</strong> — ✅ Correct`;
    } else {
      sol.classList.add('incorrect');
      sol.innerHTML = `<strong>Q${id}</strong> — Your answer: <em>${raw || 'No answer'}</em> — ❌ Correct: <strong>${correct}</strong>`;
    }
    solDiv.appendChild(sol);
  }
  document.getElementById('scoreBox').textContent = `Score: ${score} / ${currentSet.length}`;
  document.getElementById('summaryText').innerHTML = `<strong>Result:</strong> You scored <strong>${score}</strong> out of <strong>${currentSet.length}</strong>.`;
  document.getElementById('resultsPanel').style.display = 'block';
  document.getElementById('resultsPanel').scrollIntoView({ behavior: 'smooth' });
}

// show solutions only (correct answers)
function showSolutionsOnly(){
  const solDiv = document.getElementById('solutions');
  solDiv.innerHTML = '';
  for(let i=0;i<currentSet.length;i++){
    const id = i+1;
    const correct = currentSet[i].a;
    const sol = document.createElement('div');
    sol.className = 'sol correct';
    sol.innerHTML = `<strong>Q${id}:</strong> ${currentSet[i].q} <strong>${correct}</strong>`;
    solDiv.appendChild(sol);
  }
  document.getElementById('summaryText').innerHTML = `<strong>All solutions</strong>`;
  document.getElementById('resultsPanel').style.display = 'block';
  document.getElementById('resultsPanel').scrollIntoView({ behavior: 'smooth' });
}

// regenerate (reshuffle questions)
function regenerate(){
  const anyFilled = Array.from(document.querySelectorAll('.ansBox')).some(i=>i.value.trim() !== '');
  if(anyFilled){
    if(!confirm('Generate a new random order of questions? Current answers will be lost.')) return;
  }
  currentSet = buildSet();
  render(currentSet);
  document.getElementById('resultsPanel').style.display = 'none';
  document.getElementById('scoreBox').textContent = `Not yet attempted`;
  window.scrollTo({ top: 0, behavior: 'instant' });
}

// print
function printPage(){ window.print(); }

// wire buttons
document.getElementById('btnCheck').addEventListener('click', checkAnswers);
document.getElementById('btnReset').addEventListener('click', regenerate);
document.getElementById('btnShowSol').addEventListener('click', showSolutionsOnly);
document.getElementById('btnDownload').addEventListener('click', printPage);

// initialize
regenerate();

</script>
</body>
</html>
